  <circle cx="183" cy="61" r="13"/>
  <circle cx="200" cy="193" r="13"/>
</g>
<g fill="#03170c" stroke="#65ed70" stroke-width="6">
  <circle cx="47" cy="106" r="13"/>
  <circle cx="183" cy="61" r="13"/>
  <circle cx="200" cy="193" r="13"/>
</g>
<g fill="#65ed70" stroke="none">
