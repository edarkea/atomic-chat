<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
<title id="title">Atomic Chat — átomo de conversación</title>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Orbitas del atomo: dibujo original, no marcas de terceros. -->
  <g stroke="#04170b" stroke-width="15">
    <ellipse cx="128" cy="128" rx="40" ry="115"/>
    <ellipse cx="128" cy="128" rx="119" ry="43" transform="rotate(28 128 128)"/>
    <ellipse cx="128" cy="128" rx="119" ry="43" transform="rotate(-28 128 128)"/>
  </g>
  <g stroke="#65ed70" stroke-width="9.2">
    <ellipse cx="128" cy="128" rx="40" ry="115"/>
    <ellipse cx="128" cy="128" rx="119" ry="43" transform="rotate(28 128 128)"/>
    <ellipse cx="128" cy="128" rx="119" ry="43" transform="rotate(-28 128 128)"/>
  </g>
</g>
<!-- Tres electrones. -->
<g fill="#03170c" stroke="#04170b" stroke-width="13">
