<aside class="sidebar">
  <app-operator-presence
    [model]="model().operator"
    (presenceToggle)="presenceToggle.emit()"
    (presenceClose)="presenceClose.emit()"
    (presenceSelected)="presenceSelected.emit($event)"
    (presenceStatusChange)="presenceStatusChange.emit($event)"
  />
  <app-conversation-list
    [model]="model().conversations"
    (searchChange)="searchChange.emit($event)"
    (useJid)="useJid.emit()"
    (selectRoom)="selectRoom.emit($event)"
    (selectContact)="selectContact.emit($event)"
    (newMessageToggle)="newMessageToggle.emit()"
    (preferencesToggle)="preferencesToggle.emit()"
    (nicknameChange)="nicknameChange.emit($event)"
    (discoverRooms)="discoverRooms.emit()"
    (joinRoom)="joinRoom.emit($event)"
    (leaveRoom)="leaveRoom.emit()"
    (refreshRoster)="refreshRoster.emit()"
    (disconnect)="disconnect.emit()"
  />
</aside>
