<form class="composer" (ngSubmit)="messageSubmitted.emit()">
  @if (showAttach()) {
    <button
      class="composer-icon"
      type="button"
      aria-label="Adjuntar"
      (click)="attach.emit()"
      [disabled]="disabled()"
    >
      <svg class="ac-icon ac-icon--20" aria-hidden="true" focusable="false"><use href="#ac-attach" /></svg>
    </button>
  }
  <input
    [attr.name]="inputName()"
    [ngModel]="draft()"
    [ngModelOptions]="{ standalone: true }"
    (ngModelChange)="draftChange.emit($event)"
    (focus)="inputFocus.emit()"
    (blur)="inputBlur.emit()"
    [placeholder]="placeholder()"
    autocomplete="off"
    [disabled]="disabled()"
  />
  @if (showEmoji()) {
    <span class="emoji" aria-hidden="true"><svg class="ac-icon ac-icon--20" aria-hidden="true" focusable="false"><use href="#ac-emoji" /></svg></span>
  }
  <button class="send" type="submit" aria-label="Enviar" [disabled]="disabled() || !draft().trim()">
    <svg class="ac-icon ac-icon--20" aria-hidden="true" focusable="false"><use href="#ac-send" /></svg>
  </button>
</form>
