<article class="message" [class.outgoing]="outgoing()" [class.incoming]="!outgoing()">
  <div class="message-sender-line">
    <p class="message-sender">{{ sender() }}</p>
    @if (classification() === 'broadcast') {
      <span class="broadcast-badge">DIFUSIÓN</span>
    }
  </div>
  <p>{{ body() }}</p>
  @if (persistenceStatus() === 'memory-only') {
    <small class="message-persistence-warning"
      >Mensaje no guardado; solo disponible en esta sesión.</small
    >
  }
</article>
