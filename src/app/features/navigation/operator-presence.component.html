<div class="operator-card" [attr.title]="operatorTooltip()">
  <div class="operator-avatar-wrap">
    @if (model().profileImage; as image) {
      <app-user-profile-image
        class="operator-profile-image"
        [accountId]="model().accountId"
        [image]="image"
        [alt]="'Avatar de ' + displayName()"
        size="compact"
      />
    } @else {
      <span class="avatar operator-avatar" aria-hidden="true"
        ><svg class="ac-icon ac-icon--20" aria-hidden="true" focusable="false">
          <use href="#ac-contact" /></svg
      ></span>
    }
    <button
      #profileEditTrigger
      type="button"
      class="profile-edit-trigger"
      aria-label="Editar mi perfil"
      title="Editar mi perfil"
      [disabled]="model().connectionLabel.toLocaleLowerCase().includes('desconect')"
      (click)="editProfile()"
    >
      <span aria-hidden="true">✎</span>
    </button>
  </div>
  <div>
    <strong>{{ displayName() }}</strong
    ><small>{{ model().connectionLabel }} · {{ model().presenceLabel }}</small>
  </div>
  <button
    #presenceTrigger
    type="button"
    class="presence-trigger"
    aria-haspopup="menu"
    [attr.aria-label]="'Cambiar estado: ' + model().presenceLabel"
    [attr.aria-expanded]="model().presenceOpen"
    (click)="presenceToggle.emit()"
    (keydown)="onTriggerKeydown($event)"
  >
    <i class="presence-dot" [class]="'presence-dot ' + model().presenceDot"></i
    ><span class="presence-trigger-label">{{ model().presenceLabel }}</span
    ><span class="presence-arrow" aria-hidden="true"
      ><svg class="ac-icon ac-icon--16" aria-hidden="true" focusable="false">
        <use href="#ac-expand" /></svg
    ></span>
  </button>
  @if (model().presenceOpen) {
    <div class="presence-popover">
      <div #presenceMenu class="presence-menu" role="menu" aria-label="Estado de presencia">
        @for (option of model().presenceOptions; track option.id) {
          <button
            type="button"
            role="menuitemradio"
            [attr.aria-checked]="model().presenceOptionId === option.id"
            [attr.tabindex]="optionTabIndex(option)"
            (click)="selectPresence(option)"
            (keydown)="onMenuKeydown($event)"
          >
            <i class="presence-dot" [class]="'presence-dot ' + option.dot"></i>{{ option.label }}
          </button>
        }
      </div>
      <div class="presence-status-field">
        <input
          aria-label="Mensaje de estado"
          placeholder="Mensaje opcional"
          [ngModel]="model().presenceStatus"
          (ngModelChange)="presenceStatusChange.emit($event)"
          (keydown)="onStatusKeydown($event)"
        />
      </div>
    </div>
  }
</div>
