<section class="message-search" aria-label="Buscar en mensajes">
  <div class="search-controls">
    <input
      aria-label="Buscar mensajes"
      placeholder="Buscar en mensajes..."
      [ngModel]="query()"
      (ngModelChange)="queryChange.emit($event)"
    />
    <select
      aria-label="Alcance de búsqueda"
      [ngModel]="scope()"
      (ngModelChange)="scopeChange.emit($event)"
    >
      <option value="conversation" [disabled]="!conversationId()">Conversación actual</option>
      <option value="all">Todos los chats</option>
    </select>
  </div>
  @if (loading() && !results().length) {
    <p class="search-state" role="status">Buscando…</p>
  }
  @if (error()) {
    <p class="search-state error" role="alert">{{ error() }}</p>
  }
  @if (!loading() && !error() && query().trim() && !results().length) {
    <p class="search-state">No se encontraron mensajes.</p>
  }
  <div class="search-results" role="list">
    @for (hit of results(); track hit.messageId + ':' + hit.conversationId) {
      <button
        type="button"
        class="search-result"
        role="listitem"
        (click)="resultSelected.emit(hit)"
      >
        <span class="result-heading"
          ><strong>{{ conversationLabel(hit) }}</strong
          ><time [attr.datetime]="hit.createdAt" [title]="fullDate(hit.createdAt)">{{
            time(hit.createdAt)
          }}</time></span
        >
        <span class="result-meta">{{ hit.senderJid }} · {{ fullDate(hit.createdAt) }}</span>
        <span class="result-body">
          @for (part of previewParts(hit); track $index) {
            @if (part.match) {
              <mark>{{ part.text }}</mark>
            } @else {
              {{ part.text }}
            }
          }
        </span>
      </button>
    }
  </div>
  @if (hasMore()) {
    <button type="button" class="load-more" [disabled]="loading()" (click)="loadMore.emit()">
      {{ loading() ? 'Cargando…' : 'Cargar más' }}
    </button>
  }
</section>
