<section class="emoji-picker" role="dialog" aria-label="Selector de emojis">
  <div class="emoji-toolbar">
    <input
      aria-label="Buscar emoji por nombre"
      placeholder="Buscar emoji..."
      [ngModel]="query()"
      (ngModelChange)="query.set($event)"
    />
    <button
      type="button"
      class="close"
      aria-label="Cerrar selector de emojis"
      (click)="closed.emit()"
    >
      ×
    </button>
  </div>
  <div class="emoji-categories" role="tablist" aria-label="Categorías de emojis">
    @for (item of categories; track item) {
      <button
        type="button"
        role="tab"
        [attr.aria-selected]="category() === item"
        (click)="category.set(item)"
      >
        {{ item }}
      </button>
    }
  </div>
  @if (showRecentSection()) {
    <section class="emoji-section emoji-section--recent" aria-labelledby="recent-emojis-label">
      <p id="recent-emojis-label" class="emoji-label">Recientes</p>
      <div class="emoji-grid" aria-label="Emojis recientes">
        @for (entry of recentEntries(); track entry.emoji) {
          <button
            type="button"
            [attr.aria-label]="entry.name"
            [attr.data-tooltip]="entry.name"
            (click)="chooseRecent(entry.emoji)"
          >
            {{ entry.emoji }}
          </button>
        }
      </div>
    </section>
  }
  <section
    class="emoji-section emoji-section--all"
    [class.emoji-section--separated]="showRecentSection()"
    [attr.aria-labelledby]="showRecentSection() ? 'all-emojis-label' : null"
    [attr.aria-label]="showRecentSection() ? null : 'Emojis disponibles'"
  >
    @if (showRecentSection()) {
      <p id="all-emojis-label" class="emoji-label">Todos</p>
    }
    <div class="emoji-grid" aria-label="Emojis disponibles">
      @for (entry of visible(); track entry.emoji) {
        <button
          type="button"
          [attr.aria-label]="entry.name"
          [attr.data-tooltip]="entry.name"
          (click)="choose(entry)"
        >
          {{ entry.emoji }}
        </button>
      }
    </div>
  </section>
  @if (!visible().length) {
    <p class="empty">No hay emojis para esa búsqueda.</p>
  }
</section>
