<div class="operator-card">
  <span class="avatar operator-avatar">♙</span>
  <div>
    <strong>{{ model().accountId }}</strong
    ><small>{{ model().connectionLabel }} · {{ model().presenceLabel }}</small>
  </div>
  <span class="online-dot" [class]="'online-dot ' + model().presenceDot" aria-hidden="true"></span>
</div>
<div class="presence-control">
  <span>Estado</span
  ><button
    #presenceTrigger
    type="button"
    class="presence-trigger"
    aria-haspopup="menu"
    [attr.aria-expanded]="model().presenceOpen"
    (click)="presenceToggle.emit()"
    (keydown)="onTriggerKeydown($event)"
  >
    <i class="presence-dot" [class]="'presence-dot ' + model().presenceDot"></i
    ><span>{{ model().presenceLabel }}</span
    ><span class="presence-arrow" aria-hidden="true">⌄</span>
  </button>
  @if (model().presenceOpen) {
    <div class="presence-popover">
      <div #presenceMenu class="presence-menu" role="menu" aria-label="Estado de presencia">
        @for (option of model().presenceOptions; track option.id) {
          <button
            type="button"
            role="menuitemradio"
            [attr.aria-checked]="model().presenceOptionId === option.id"
            [attr.tabindex]="optionTabIndex(option)"
            (click)="selectPresence(option)"
            (keydown)="onMenuKeydown($event)"
          >
            <i class="presence-dot" [class]="'presence-dot ' + option.dot"></i>{{ option.label }}
          </button>
        }
      </div>
      <div class="presence-status-field">
        <input
          aria-label="Mensaje de estado"
          placeholder="Mensaje opcional"
          [ngModel]="model().presenceStatus"
          (ngModelChange)="presenceStatusChange.emit($event)"
          (keydown)="onStatusKeydown($event)"
        />
      </div>
    </div>
  }
</div>
@if (model().settingsOpen) {
  <section class="preferences-panel" aria-label="Preferencias">
    <strong>Preferencias</strong
    ><label
      >Tema<select [ngModel]="model().preferences.theme" disabled>
        <option value="atomic">Atomic</option>
      </select></label
    ><label class="check-preference"
      ><input
        type="checkbox"
        [ngModel]="model().preferences.notifications"
        (ngModelChange)="preferencesChange.emit({ notifications: $event })"
      />
      Notificaciones</label
    ><label class="check-preference"
      ><input
        type="checkbox"
        [ngModel]="model().preferences.autoLogin"
        (ngModelChange)="preferencesChange.emit({ autoLogin: $event })"
      />
      Inicio automático</label
    ><button type="button" (click)="resetPreferences.emit()">Restablecer</button>
  </section>
}
