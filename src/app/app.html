@if (!chat.isConnected()) {
  <app-login-panel
    [accountId]="login().accountId"
    [password]="login().password"
    [error]="chat.error()"
    (accountIdChange)="setLoginAccount($event)"
    (passwordChange)="setLoginPassword($event)"
    (submitted)="connect()"
  />
} @else {
  <main class="app-window">
    <header class="titlebar">
      <div class="brand">
        <span class="brand-mark">⌁</span><strong>ATOMIC CHAT</strong
        ><span class="concept">Concepto</span>
      </div>
    </header>
    <section class="workspace">
      <app-sidebar
        [model]="sidebarModel()"
        (presenceToggle)="presenceOpen.update((value) => !value)"
        (presenceClose)="presenceOpen.set(false)"
        (presenceSelected)="choosePresence($event)"
        (presenceStatusChange)="presenceStatus.set($event)"
        (settingsToggle)="settingsOpen.update((value) => !value)"
        (preferencesChange)="updatePreferences($event)"
        (resetPreferences)="chat.resetPreferences()"
        (nicknameChange)="mucNickname.set($event)"
        (discoverRooms)="discoverRooms()"
        (selectRoom)="selectRoomFromCatalog($event)"
        (joinRoom)="joinRoom($event)"
        (leaveRoom)="leaveRoom()"
        (searchChange)="search.set($event)"
        (useJid)="useJid()"
        (selectContact)="selectContact($event)"
        (refreshRoster)="chat.refreshRoster()"
        (disconnect)="disconnect()"
      />
      <section class="conversation-panel">
        @if (activeRoomState(); as roomState) {
          <app-muc-view
            [roomState]="roomState"
            [notices]="muc.visibleNotices()"
            [participants]="muc.visibleParticipants()"
            [allParticipantCount]="muc.participants().length"
            [participantPage]="muc.participantPage()"
            [hasMoreParticipants]="muc.hasMoreParticipants()"
            [messages]="muc.messages()"
            [draft]="mucDraft()"
            (leave)="leaveRoom()"
            (previousParticipantPage)="muc.previousParticipantPage()"
            (nextParticipantPage)="muc.nextParticipantPage()"
            (draftChange)="mucDraft.set($event)"
            (send)="sendRoom()"
          />
        } @else {
          <app-conversation-view
            [activeContact]="activeContact()"
            [selectedJid]="selectedJid()"
            [accountId]="chat.accountId()"
            [timeline]="conversationTimeline()"
            [error]="chat.error()"
            [draft]="draft()"
            [historyLoading]="chat.historyLoading()"
            [hasOlderMessages]="chat.hasOlderMessages()"
            [hasNewerMessages]="chat.hasNewerMessages()"
            (draftChange)="draft.set($event)"
            (messageSend)="send()"
            (attach)="attach()"
            (accept)="files.accept($event)"
            (reject)="files.reject($event)"
            (fileCancel)="files.cancel($event)"
            (loadOlder)="loadOlderMessages($event)"
            (loadNewer)="loadNewerMessages($event)"
          />
        }
      </section>
    </section>
  </main>
}
@if (certificateRequest(); as request) {
  <app-certificate-dialog [request]="request" (decision)="decideCertificate($event)" />
}
