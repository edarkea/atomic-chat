name: CI tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Focused checks
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Security audit gate
        run: npm audit --audit-level=high
      - name: Type and format checks
        run: |
          npm run typecheck
          npm run format:check
      - name: Focused tests
        run: npm run test:ci:focused
      - name: Write failure context
        if: failure()
        run: |
          mkdir -p ci-reports
          {
            echo "workflow=${{ github.workflow }}"
            echo "run=${{ github.run_id }}"
            echo "commit=${{ github.sha }}"
            echo "actor=${{ github.actor }}"
          } > ci-reports/failure-context.txt
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-${{ github.run_id }}
          path: ci-reports/failure-context.txt
          if-no-files-found: error
          retention-days: 7
