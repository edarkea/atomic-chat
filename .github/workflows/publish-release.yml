name: Publish release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor == 'edarkea' || contains(format(',{0},', vars.ATOMIC_RELEASE_PUBLISHERS), format(',{0},', github.actor))
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Read package version and verify main
        id: metadata
        run: |
          set -euo pipefail
          git fetch origin main --tags
          checked_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          test "$checked_sha" = "$main_sha"
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null || git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "release tag $tag already exists" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$checked_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Security audit gate
        run: npm audit --audit-level=high
      - name: Focused release checks
        run: |
          npm run typecheck
          npm run format:check
          npm run test:ci:focused

  build-windows:
    if: github.actor == 'edarkea' || contains(format(',{0},', vars.ATOMIC_RELEASE_PUBLISHERS), format(',{0},', github.actor))
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - name: Verify package version and approved commit
        shell: pwsh
        run: |
          $checkedSha = (git rev-parse HEAD).Trim()
          if ($checkedSha -ne $env:RELEASE_SHA) { throw 'checked out commit differs from the approved main commit' }
          $packageVersion = node -p "require('./package.json').version"
          if ($packageVersion -ne $env:RELEASE_VERSION) { throw "package.json version $packageVersion does not match the release version" }
          if ($env:RELEASE_TAG -ne "v$packageVersion") { throw 'release tag must be v<package.json.version>' }
      - run: npm ci
      - run: npx electron-builder install-app-deps
      - run: npm run build
      - run: npx electron-builder --win nsis --x64 --publish never
      - name: Generate checksums
        shell: pwsh
        run: |
          $releasePath = (Resolve-Path -LiteralPath release).Path
          $manifestPath = Join-Path $releasePath 'SHA256SUMS.txt'
          $files = @(Get-ChildItem -LiteralPath $releasePath -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object -Property Name)
          if ($files.Count -eq 0) { throw 'release contains no artifacts to checksum' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($manifestPath, (($lines -join "`n") + "`n"), $utf8NoBom)
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) { throw 'checksum manifest was not created' }
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.validate.outputs.version }}-windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 3

  build-linux:
    if: github.actor == 'edarkea' || contains(format(',{0},', vars.ATOMIC_RELEASE_PUBLISHERS), format(',{0},', github.actor))
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - name: Verify package version and approved commit
        run: |
          set -euo pipefail
          checked_sha="$(git rev-parse HEAD)"
          test "$checked_sha" = "$RELEASE_SHA"
          package_version="$(node -p "require('./package.json').version")"
          test "$package_version" = "$RELEASE_VERSION"
          test "$RELEASE_TAG" = "v$package_version"
      - run: npm ci
      - run: npx electron-builder install-app-deps
      - run: npm run build
      - run: npx electron-builder --linux deb AppImage --x64 --publish never
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release
          mapfile -d '' -t artifacts < <(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' | LC_ALL=C sort -z)
          if ((${#artifacts[@]} == 0)); then
            echo 'release contains no artifacts to checksum' >&2
            exit 1
          fi
          printf '%s\0' "${artifacts[@]}" | xargs -0 -r sha256sum > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.validate.outputs.version }}-linux-x64
          path: release/*
          if-no-files-found: error
          retention-days: 3

  publish:
    if: github.actor == 'edarkea' || contains(format(',{0},', vars.ATOMIC_RELEASE_PUBLISHERS), format(',{0},', github.actor))
    needs: [validate, build-windows, build-linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
    environment:
      name: production-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.validate.outputs.version }}-windows-x64
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.validate.outputs.version }}-linux-x64
          path: release/linux
      - name: Verify manifests and stage release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          checked_sha="$(git rev-parse HEAD)"
          test "$checked_sha" = "$RELEASE_SHA"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          test -s release/windows/SHA256SUMS.txt
          test -s release/linux/SHA256SUMS.txt
          normalize_windows_manifest() {
            local manifest="release/windows/SHA256SUMS.txt"
            local normalized
            normalized="$(mktemp)"
            perl -0pe 's/\r+(?:\n|\z)/\n/g; s/\r+(?=[0-9A-Fa-f]{64}  )/\n/g' "$manifest" > "$normalized"
            mv -- "$normalized" "$manifest"
          }
          normalize_windows_manifest
          (cd release/windows && sha256sum -c SHA256SUMS.txt)
          (cd release/linux && sha256sum -c SHA256SUMS.txt)

          release_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          case "$release_status" in
            200)
              gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
              echo 'release already exists; stable releases are never overwritten' >&2
              exit 1
              ;;
            404)
              echo "release $RELEASE_TAG does not exist; continuing"
              ;;
            401|403)
              echo "GitHub API authentication/authorization failed with HTTP $release_status" >&2
              exit 1
              ;;
            *)
              echo "GitHub API check failed with unexpected HTTP $release_status" >&2
              exit 1
              ;;
          esac

          rm -rf release/publish
          mkdir -p release/publish
          windows_artifacts=()
          linux_artifacts=()

          copy_one() {
            local source="$1"
            local platform="$2"
            local base
            test -f "$source"
            base="$(basename -- "$source")"
            if [[ -e "release/publish/$base" ]]; then
              echo "artifact name collision: $base" >&2
              exit 1
            fi
            cp -- "$source" release/publish/
            if [[ "$platform" == windows ]]; then
              windows_artifacts+=("$base")
            else
              linux_artifacts+=("$base")
            fi
          }

          copy_pattern() {
            local source_dir="$1"
            local pattern="$2"
            local platform="$3"
            local file
            local -a matches=()
            mapfile -d '' -t matches < <(find "$source_dir" -maxdepth 1 -type f -name "$pattern" -print0 | sort -z)
            if ((${#matches[@]} == 0)); then
              echo "no $pattern artifact found in $source_dir" >&2
              exit 1
            fi
            for file in "${matches[@]}"; do
              copy_one "$file" "$platform"
            done
          }

          copy_one release/windows/latest.yml windows
          copy_pattern release/windows '*.exe' windows
          copy_pattern release/windows '*.blockmap' windows
          copy_one release/linux/latest-linux.yml linux
          copy_pattern release/linux '*.deb' linux
          copy_pattern release/linux '*.AppImage' linux
          copy_pattern release/linux '*.blockmap' linux

          if find release/publish -maxdepth 1 \( -name 'builder-debug.yml' -o -name 'win-unpacked' -o -name 'linux-unpacked' \) -print -quit | grep -q .; then
            echo 'debug files or unpacked directories must not enter release staging' >&2
            exit 1
          fi

          verify_update_manifest() {
            local manifest="$1"
            local reference
            local references=0
            while IFS= read -r reference; do
              reference="${reference%$'\r'}"
              [[ -n "$reference" ]] || continue
              references=$((references + 1))
              if [[ "$reference" == /* || "$reference" == *'/'* || "$reference" == .* ]]; then
                echo "manifest contains an invalid staged path: $reference" >&2
                exit 1
              fi
              test -f "release/publish/$reference"
            done < <(grep -E '^[[:space:]]*(url|path):[[:space:]]*' "$manifest" | sed -E 's/^[[:space:]]*(url|path):[[:space:]]*//; s/^"//; s/"$//')
            if ((references == 0)); then
              echo "manifest has no artifact references: $manifest" >&2
              exit 1
            fi
          }

          verify_update_manifest release/publish/latest.yml
          verify_update_manifest release/publish/latest-linux.yml

          write_manifest() {
            local manifest_name="$1"
            shift
            local -a files=("$@")
            if ((${#files[@]} == 0)); then
              echo "cannot create empty manifest: $manifest_name" >&2
              exit 1
            fi
            (
              cd release/publish
              printf '%s\0' "${files[@]}" | sort -z | xargs -0 -r sha256sum > "$manifest_name"
              test -s "$manifest_name"
              sha256sum -c "$manifest_name"
            )
          }

          write_manifest SHA256SUMS-windows-x64.txt "${windows_artifacts[@]}"
          write_manifest SHA256SUMS-linux-x64.txt "${linux_artifacts[@]}"

          global_manifest="SHA256SUMS-${RELEASE_VERSION}.txt"
          (
            cd release/publish
            mapfile -d '' -t final_artifacts < <(find . -maxdepth 1 -type f ! -name "$global_manifest" -printf '%f\0' | sort -z)
            if ((${#final_artifacts[@]} == 0)); then
              echo 'final release staging contains no artifacts' >&2
              exit 1
            fi
            printf '%s\0' "${final_artifacts[@]}" | xargs -0 -r sha256sum > "$global_manifest"
            test -s "$global_manifest"
            sha256sum -c "$global_manifest"
          )
      - name: Create the release tag from package.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null || git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release tag $RELEASE_TAG already exists" >&2
            exit 1
          fi
          git tag --annotate "$RELEASE_TAG" "$RELEASE_SHA" --message "Atomic Chat $RELEASE_TAG"
          git push origin "$RELEASE_TAG"
      - name: Create the approved stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          build_sha="$(git rev-parse HEAD)"
          mapfile -d '' -t release_files < <(find release/publish -maxdepth 1 -type f -print0 | LC_ALL=C sort -z)
          if ((${#release_files[@]} == 0)); then
            echo 'release staging is empty' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${release_files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Atomic Chat $RELEASE_VERSION" \
            --notes "Built from $build_sha by $GITHUB_ACTOR."
