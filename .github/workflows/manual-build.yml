name: Manual build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - windows-portable
          - linux

permissions:
  contents: read

concurrency:
  group: manual-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: inputs.target == 'all' || inputs.target == 'windows' || inputs.target == 'windows-portable'
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild native production dependencies
        run: npx electron-builder install-app-deps
      - run: npm run build
      - name: Package Windows NSIS x64 without publishing
        if: inputs.target == 'all' || inputs.target == 'windows'
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Package Windows portable x64 without publishing
        if: inputs.target == 'windows-portable'
        run: npx electron-builder --win portable --x64 --publish never
      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $releasePath = (Resolve-Path -LiteralPath release).Path
          $manifestPath = Join-Path $releasePath 'SHA256SUMS.txt'
          $files = @(Get-ChildItem -LiteralPath $releasePath -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object -Property Name)
          if ($files.Count -eq 0) { throw 'release contains no artifacts to checksum' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($manifestPath, (($lines -join "`n") + "`n"), $utf8NoBom)
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) { throw 'checksum manifest was not created' }
      - uses: actions/upload-artifact@v4
        with:
          name: atomic-chat-${{ github.sha }}-windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 7

  linux:
    if: inputs.target == 'all' || inputs.target == 'linux'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild native production dependencies
        run: npx electron-builder install-app-deps
      - run: npm run build
      - name: Package Linux DEB and AppImage x64 without publishing
        run: npx electron-builder --linux deb AppImage --x64 --publish never
      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          cd release
          mapfile -d '' -t artifacts < <(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' | LC_ALL=C sort -z)
          if ((${#artifacts[@]} == 0)); then
            echo 'release contains no artifacts to checksum' >&2
            exit 1
          fi
          printf '%s\0' "${artifacts[@]}" | xargs -0 -r sha256sum > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: atomic-chat-${{ github.sha }}-linux-x64
          path: release/*
          if-no-files-found: error
          retention-days: 7
